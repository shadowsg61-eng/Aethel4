<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aethel 4 · Rango IMC + Feed</title>
  <style>
    /* ===== RESET Y ESTILOS BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100vh; background-color: #0B1426; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(46, 204, 113, 0.3); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(46, 204, 113, 0.5); }

    body {
      background: linear-gradient(145deg, #0B1426, #13203A, #0F1A2E);
      background-attachment: fixed; background-size: cover;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex; justify-content: center; align-items: flex-start;
      padding: 40px 20px; position: relative; overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(46, 204, 113, 0.03) 0%, transparent 60%),
                  radial-gradient(circle at 80% 70%, rgba(46, 204, 113, 0.03) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    .container { width: 100%; max-width: 480px; position: relative; z-index: 1; margin: auto; }

    .card {
      background: rgba(19, 32, 58, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 24px; padding: 36px 28px 24px; border: 1px solid rgba(46, 204, 113, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 40px rgba(46, 204, 113, 0.03);
      transition: all 0.3s ease;
    }
    .card:hover { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 60px rgba(46, 204, 113, 0.06); }

    /* ===== HEADER ===== */
    .header { text-align: center; margin-bottom: 24px; position: relative; }
    .header .icon {
      font-size: 28px; color: #2ECC71; display: block; margin-bottom: 4px;
      text-shadow: 0 0 20px rgba(46, 204, 113, 0.3); animation: pulseGlow 2s ease-in-out infinite;
    }
    @keyframes pulseGlow { 0%, 100% { text-shadow: 0 0 20px rgba(46, 204, 113, 0.3); } 50% { text-shadow: 0 0 40px rgba(46, 204, 113, 0.6); } }
    .header h1 { font-size: 26px; letter-spacing: 8px; color: #E8E6E3; font-weight: 300; }
    .header h1 span { color: #2ECC71; }
    .lema { font-size: 14px; color: #8A8F9A; margin-top: 4px; letter-spacing: 1px; }

    .btn-hamburguesa {
      position: absolute; right: 0; top: 0; background: transparent; border: none;
      color: #8A8F9A; font-size: 24px; cursor: pointer; transition: all 0.3s ease; padding: 4px;
    }
    .btn-hamburguesa:hover { color: #2ECC71; text-shadow: 0 0 15px rgba(46, 204, 113, 0.4); }

    .return-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(46, 204, 113, 0.1); }
    .return-bar button { background: transparent; border: none; color: #2ECC71; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; padding: 4px 8px; border-radius: 6px; }
    .return-bar button:hover { background: rgba(46, 204, 113, 0.1); }

    /* ===== NAVEGACIÓN (TABS) ===== */
    .nav-tabs { display: flex; gap: 10px; background: rgba(0, 0, 0, 0.2); padding: 6px; border-radius: 12px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: #8A8F9A; font-size: 14px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; outline: none; }
    .tab-btn:hover { color: #E8E6E3; }
    .tab-btn.active { background: rgba(46, 204, 113, 0.1); color: #2ECC71; box-shadow: 0 0 15px rgba(46, 204, 113, 0.1); }

    /* ===== INPUTS ===== */
    .input-group { margin-bottom: 22px; transition: all 0.3s ease; }
    .input-group label { display: block; font-size: 13px; color: #8A8F9A; margin-bottom: 6px; letter-spacing: 0.5px; }
    .input-group input, .input-group select, .input-group textarea {
      width: 100%; padding: 12px 14px; background: rgba(255, 255, 255, 0.03); border: none; border-bottom: 1px solid rgba(46, 204, 113, 0.2); color: #E8E6E3; font-size: 15px; font-family: inherit; outline: none; transition: all 0.3s ease;
    }
    .input-group textarea { resize: vertical; min-height: 80px; }
    .input-group select option { background: #13203A; color: #E8E6E3; }
    .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-bottom-color: #2ECC71; box-shadow: 0 4px 20px rgba(46, 204, 113, 0.1); background: rgba(255, 255, 255, 0.05); }
    .input-group input::placeholder, .input-group textarea::placeholder { color: #5A6070; font-weight: 300; }
    
    .input-group.flex-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 16px; }
    .input-group.flex-row input { margin-bottom: 0; }
    .input-group.flex-row button { margin-top: 0; padding: 12px; width: auto; flex-shrink: 0; }
    .row-3 { display: flex; gap: 12px; margin-bottom: 22px; }
    .row-3 > div { flex: 1; }

    /* ===== BOTONES ===== */
    button.btn-base {
      width: 100%; padding: 14px; background: linear-gradient(135deg, rgba(46, 204, 113, 0.1), rgba(26, 188, 156, 0.05));
      border: 1px solid rgba(46, 204, 113, 0.3); color: #E8E6E3; font-size: 16px; font-weight: 500; letter-spacing: 2px; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; margin-top: 8px; position: relative; overflow: hidden;
    }
    button.btn-base::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(46, 204, 113, 0.1), transparent); transition: left 0.5s ease; }
    button.btn-base:hover::before { left: 100%; }
    button.btn-base:hover { background: linear-gradient(135deg, #2ECC71, #1ABC9C); color: #0B1426; box-shadow: 0 0 30px rgba(46, 204, 113, 0.3); border-color: #2ECC71; transform: translateY(-1px); }
    .primario { background: linear-gradient(135deg, #2ECC71, #1ABC9C); color: #0B1426; border: none; box-shadow: 0 0 20px rgba(46, 204, 113, 0.15); }
    .primario:hover { background: linear-gradient(135deg, #3DDC84, #26A69A) !important; box-shadow: 0 0 40px rgba(46, 204, 113, 0.3) !important; transform: translateY(-2px) !important; }
    .secundario { background: rgba(255, 255, 255, 0.03); color: #E8E6E3; border: 1px solid rgba(46, 204, 113, 0.2); }
    .secundario:hover { border-color: #2ECC71 !important; color: #2ECC71 !important; box-shadow: 0 0 20px rgba(46, 204, 113, 0.1) !important; background: rgba(46, 204, 113, 0.05) !important; }
    
    .links { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .links a { color: #8A8F9A; font-size: 13px; text-decoration: none; transition: all 0.3s ease; }
    .links a:hover { color: #2ECC71; text-shadow: 0 0 20px rgba(46, 204, 113, 0.1); }
    .message { margin-top: 20px; text-align: center; font-size: 14px; display: none; padding: 8px; border-radius: 6px; background: rgba(0, 0, 0, 0.3); }

    /* ===== PERFIL ===== */
    .profile { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
    .avatar {
      width: 70px; height: 70px; background: linear-gradient(135deg, #1A2A4A, #13203A); border-radius: 50%;
      display: flex; justify-content: center; align-items: center; font-size: 28px; color: #E8E6E3; font-weight: 500;
      border: 2px solid #2ECC71; flex-shrink: 0; overflow: hidden; position: relative; box-shadow: 0 0 30px rgba(46, 204, 113, 0.15); transition: all 0.3s ease;
    }
    .avatar:hover { box-shadow: 0 0 50px rgba(46, 204, 113, 0.25); transform: scale(1.02); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 1; }
    .avatar span { position: relative; z-index: 1; }
    .info h2 { font-size: 20px; color: #E8E6E3; font-weight: 400; }
    .details { display: flex; flex-wrap: wrap; gap: 12px 20px; margin-top: 6px; font-size: 14px; color: #8A8F9A; }
    .details strong { color: #E8E6E3; font-weight: 500; }

    /* ===== RANGO Y PUNTOS ===== */
    .rango-container { position: relative; background: rgba(0, 0, 0, 0.3); border-radius: 16px; padding: 16px 20px; margin-bottom: 28px; border: 1px solid rgba(46, 204, 113, 0.05); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .rango-info { display: flex; flex-direction: column; }
    .rango-info .label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #8A8F9A; }
    .rango-info .imc { font-size: 13px; color: #8A8F9A; }
    .rango-badge { font-size: 48px; font-weight: 700; line-height: 1; text-shadow: 0 0 30px currentColor; }
    
    .rango-S .rango-badge { color: #2ECC71; } .rango-S { border-color: rgba(46, 204, 113, 0.3); }
    .rango-A .rango-badge { color: #5DADE2; } .rango-A { border-color: rgba(93, 173, 226, 0.3); }
    .rango-B .rango-badge { color: #58D68D; } .rango-B { border-color: rgba(88, 214, 141, 0.3); }
    .rango-C .rango-badge { color: #F39C12; } .rango-C { border-color: rgba(243, 156, 18, 0.3); }

    .btn-stats-info {
      position: absolute; top: 12px; right: 12px; background: transparent; border: none;
      color: rgba(255,255,255,0.3); cursor: pointer; font-size: 16px; transition: all 0.3s ease; padding: 4px;
    }
    .btn-stats-info:hover { color: #5DADE2; text-shadow: 0 0 10px rgba(93, 173, 226, 0.5); transform: scale(1.1); }

    .puntos { background: rgba(0, 0, 0, 0.3); border-radius: 16px; padding: 18px 20px; margin-bottom: 28px; border: 1px solid rgba(46, 204, 113, 0.05); }
    .puntos-label { font-size: 13px; color: #8A8F9A; text-transform: uppercase; letter-spacing: 1px; }
    .puntos-valor { font-size: 42px; font-weight: 300; background: linear-gradient(135deg, #2ECC71, #1ABC9C); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 4px 0 0; text-shadow: 0 0 40px rgba(46, 204, 113, 0.1); line-height: 1; }

    /* ===== CRITERIOS ===== */
    .criterios { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
    .criterio { display: grid; grid-template-columns: 100px 1fr 50px; align-items: center; gap: 12px; }
    .criterio .label { font-size: 13px; color: #E8E6E3; }
    .criterio .valor { font-size: 13px; color: #8A8F9A; text-align: right; }
    #kilosValor, .amigo-kilos-valor { color: #2ECC71; font-weight: 600; font-size: 14px; text-shadow: 0 0 12px rgba(46, 204, 113, 0.5), 0 0 20px rgba(46, 204, 113, 0.2); }
    .criterio .barra { height: 6px; background: rgba(255, 255, 255, 0.05); border-radius: 6px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.3); }
    .criterio .barra div { height: 100%; background: linear-gradient(90deg, #2ECC71, #1ABC9C); border-radius: 6px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 15px rgba(46, 204, 113, 0.1); }
    .acciones { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px;}
    .acciones button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; min-width: 120px; }

    /* ===== FEED DE ACTIVIDAD Y VOTACIÓN ===== */
    .feed-list-container { display: flex; flex-direction: column; gap: 16px; padding-bottom: 10px; }
    .feed-item { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(46, 204, 113, 0.05); border-radius: 16px; padding: 16px; animation: fadeIn 0.4s ease; }
    .feed-header-item { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .feed-avatar { width: 42px; height: 42px; border-radius: 50%; background: #1A2A4A; display: flex; justify-content: center; align-items: center; color: #E8E6E3; font-weight: 500; font-size: 16px; border: 1px solid rgba(46, 204, 113, 0.3); overflow: hidden; flex-shrink: 0; }
    .feed-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .feed-meta { flex: 1; }
    .feed-name { color: #E8E6E3; font-size: 14px; font-weight: 500; margin-bottom: 2px; }
    .feed-time { color: #5A6070; font-size: 11px; display: flex; align-items: center; gap: 6px;}
    .feed-icon { font-size: 18px; margin-right: 6px; }
    .feed-post-actions { display: flex; gap: 8px; }
    .feed-post-actions button { background: transparent; border: none; color: #5A6070; font-size: 16px; cursor: pointer; transition: all 0.3s ease; padding: 4px; border-radius: 6px; }
    .feed-post-actions button:hover { background: rgba(255, 255, 255, 0.05); color: #2ECC71; }
    .feed-post-actions button.btn-delete:hover { color: #E74C3C; background: rgba(231, 76, 60, 0.1); }
    .feed-body { color: #8A8F9A; font-size: 14px; margin-bottom: 12px; line-height: 1.5; word-wrap: break-word; }
    .feed-img { width: 100%; border-radius: 12px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); max-height: 300px; object-fit: cover; }
    .feed-tag { display: inline-block; background: rgba(46, 204, 113, 0.1); color: #2ECC71; font-size: 11px; font-weight: 500; padding: 4px 12px; border-radius: 20px; }
    .empty-feed { text-align: center; color: #5A6070; font-size: 14px; padding: 40px 20px; background: rgba(0,0,0,0.15); border-radius: 16px; border: 1px dashed rgba(255,255,255,0.05); }

    .feed-voting {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.05);
      display: flex; justify-content: space-between; align-items: center;
    }
    .vote-actions { display: flex; align-items: center; gap: 12px; }
    .btn-vote { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); color: #8A8F9A; font-size: 16px; border-radius: 50%; width: 34px; height: 34px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; }
    .btn-vote:hover { transform: scale(1.1); }
    .btn-vote.up:hover { color: #2ECC71; border-color: #2ECC71; background: rgba(46, 204, 113, 0.1); }
    .btn-vote.down:hover { color: #E74C3C; border-color: #E74C3C; background: rgba(231, 76, 60, 0.1); }
    .vote-count { font-size: 13px; color: #E8E6E3; font-weight: 500; }
    
    .vote-status { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 12px; }
    .vote-status.pending { color: #F39C12; background: rgba(243, 156, 18, 0.1); }
    .vote-status.approved { color: #2ECC71; background: rgba(46, 204, 113, 0.1); border: 1px solid rgba(46, 204, 113, 0.2); width: 100%; text-align: center; padding: 8px;}
    .vote-status.rejected { color: #E74C3C; background: rgba(231, 76, 60, 0.1); width: 100%; text-align: center; padding: 8px;}

    /* ===== MENÚ LATERAL (DRAWER AMIGOS) ===== */
    .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 2000; backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .drawer-overlay.active { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: -100%; width: 320px; max-width: 100%; height: 100%; background: rgba(15, 26, 46, 0.95); border-left: 1px solid rgba(46, 204, 113, 0.2); box-shadow: -20px 0 50px rgba(0,0,0,0.8); z-index: 2001; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; padding: 24px; }
    .drawer.active { right: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .drawer-header h2 { color: #E8E6E3; font-size: 20px; font-weight: 300; letter-spacing: 2px; }
    .drawer-header h2 span { color: #2ECC71; }
    .close-drawer { background: transparent; border: none; color: #8A8F9A; font-size: 24px; cursor: pointer; transition: color 0.3s ease; }
    .close-drawer:hover { color: #E74C3C; }
    .amigos-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-right: -8px; padding-right: 8px; }
    .amigo-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(0, 0, 0, 0.2); border-radius: 12px; border: 1px solid rgba(255,255,255,0.03); cursor: pointer; transition: all 0.3s ease; }
    .amigo-item:hover { background: rgba(46, 204, 113, 0.05); border-color: rgba(46, 204, 113, 0.2); }
    .amigo-avatar { width: 40px; height: 40px; border-radius: 50%; background: #1A2A4A; display: flex; justify-content: center; align-items: center; color: #E8E6E3; font-weight: 500; font-size: 16px; border: 1px solid rgba(46, 204, 113, 0.3); }
    .amigo-info { flex: 1; }
    .amigo-nombre { color: #E8E6E3; font-size: 14px; font-weight: 500; transition: color 0.3s; }
    .amigo-item:hover .amigo-nombre { color: #2ECC71; }
    .amigo-rango { color: #8A8F9A; font-size: 12px; }
    .badge-rango { font-size: 18px; font-weight: 700; margin-right: 4px; }
    .btn-delete-amigo { background: transparent; border: none; color: #5A6070; font-size: 16px; cursor: pointer; padding: 6px; border-radius: 6px; transition: all 0.3s ease; }
    .btn-delete-amigo:hover { color: #E74C3C; background: rgba(231, 76, 60, 0.1); }
    .drawer-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .btn-logout { width: 100%; background: transparent; border: 1px solid rgba(231, 76, 60, 0.2); color: #E74C3C; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-logout:hover { background: rgba(231, 76, 60, 0.1); box-shadow: 0 0 15px rgba(231, 76, 60, 0.2); }

    .hidden { display: none !important; }

    /* ===== MODALES ===== */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 3000; backdrop-filter: blur(8px); animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal { background: #13203A; border-radius: 24px; padding: 32px 24px; max-width: 420px; width: 90%; border: 1px solid rgba(46, 204, 113, 0.2); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 60px rgba(46, 204, 113, 0.05); animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    .modal h2 { color: #E8E6E3; font-weight: 300; letter-spacing: 2px; margin-bottom: 24px; text-align: center; }
    .modal h2::after { content: '✦'; display: block; font-size: 18px; color: #2ECC71; margin-top: 4px; text-shadow: 0 0 20px rgba(46, 204, 113, 0.3); }
    .modal .acciones-modal { display: flex; gap: 12px; margin-top: 20px; }
    .modal .acciones-modal button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; }
    .modal .acciones-modal .guardar { background: linear-gradient(135deg, #2ECC71, #1ABC9C); color: #0B1426; }
    .modal .acciones-modal .cancelar { background: rgba(255, 255, 255, 0.03); color: #E8E6E3; border: 1px solid rgba(46, 204, 113, 0.2); }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .stat-box { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; text-align: center; }
    .stat-box .title { font-size: 11px; color: #8A8F9A; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .stat-box .val { font-size: 20px; color: #E8E6E3; font-weight: 300; }
    .stat-box .val span { font-size: 12px; color: #5A6070; }
    .macro-bar { display: flex; height: 6px; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    .macro-p { background: #E74C3C; width: 30%; } .macro-g { background: #F39C12; width: 35%; } .macro-c { background: #5DADE2; width: 35%; }
    .macro-labels { display: flex; justify-content: space-between; font-size: 11px; color: #8A8F9A; marg
